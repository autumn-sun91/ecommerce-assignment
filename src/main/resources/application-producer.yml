spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
  data:
    redis:
      lettuce:
        pool:
          max-active: 5
          max-idle: 3
          min-idle: 1
  logging:
    level:
      com.zaxxer.hikari: DEBUG